[project]
name = "support-desk-agent"
version = "0.1.0"
description = "A support desk whose defects fire intermittently, so a detector has an anomaly to find."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
support-desk = "support_desk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support_desk"]
